name: keep-alive
# Pings the free Render demo every 10 minutes so it does not fall asleep (best effort, GitHub may delay scheduled runs).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 --retry 3 --retry-delay 10 https://sindbad.onrender.com/api/health
